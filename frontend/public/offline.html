<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b8a72" />
<title>Offline · AfeySync</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f7fa; --card: #fff; --text: #0f172a; --muted: #64748b; --brand: #0b8a72; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --card: #111a2b; --text: #e5e9f0; --muted: #94a3b8; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .card { max-width: 420px; width: 100%; background: var(--card); border-radius: 20px; padding: 32px 28px; text-align: center; box-shadow: 0 20px 50px rgba(15, 23, 42, .12); }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  button { background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="AfeySync" />
    <h1>You're offline</h1>
    <p>AfeySync needs a connection to load patient records safely. Check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
