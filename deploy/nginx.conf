# /etc/nginx/sites-available/afeysync  (then: ln -s ../sites-available/afeysync /etc/nginx/sites-enabled/)
#
#   afey.co.ke / www          -> public site (currently the facility registration page)
#   accounts.afey.co.ke       -> central sign-in
#   owner.afey.co.ke          -> owner portal
#   <facility>.afey.co.ke     -> each facility's HMIS
#   api.afey.co.ke            -> the API (M-Pesa/SHA callbacks, Google sign-in, health)
#
# Browsers never call api.afey.co.ke: every address serves /api/ itself, so each facility keeps its own
# session cookie and the API resolves the facility from the Host header.
# Certificate: one wildcard certificate for afey.co.ke + *.afey.co.ke (see DEPLOYMENT.md).

upstream afeysync_api { server 127.0.0.1:9000; keepalive 32; }
upstream afeysync_web { server 127.0.0.1:10000; keepalive 16; }

# Sign-in endpoints: 10 attempts a minute per IP (the API has its own limits and lockouts too).
limit_req_zone $binary_remote_addr zone=afs_login:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name afey.co.ke *.afey.co.ke;
  return 301 https://$host$request_uri;
}

# API host
server {
  listen 443 ssl http2;        # nginx < 1.25.1 syntax; newer nginx accepts it with a warning
  listen [::]:443 ssl http2;
  server_name api.afey.co.ke;

  ssl_certificate     /etc/letsencrypt/live/afey.co.ke/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afey.co.ke/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  client_max_body_size 20m;
  include /etc/nginx/cloudflare_realip.conf;

  location / { proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
}

# Everything else: public site, accounts, owner portal and every facility
server {
  listen 443 ssl http2;        # nginx < 1.25.1 syntax; newer nginx accepts it with a warning
  listen [::]:443 ssl http2;
  server_name afey.co.ke *.afey.co.ke;

  ssl_certificate     /etc/letsencrypt/live/afey.co.ke/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afey.co.ke/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  client_max_body_size 20m;

  # Behind Cloudflare (orange cloud): use the visitor's real IP, not Cloudflare's (see cloudflare_realip.conf).
  include /etc/nginx/cloudflare_realip.conf;

  location /api/v1/auth/find-facility { limit_req zone=afs_login burst=5 nodelay; proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /api/v1/auth/login         { limit_req zone=afs_login burst=5 nodelay; proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /api/v1/auth/handoff       { limit_req zone=afs_login burst=5 nodelay; proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /api/v1/owner/auth/login   { limit_req zone=afs_login burst=5 nodelay; proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /api/   { proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /health { proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /       { proxy_pass http://afeysync_web; include /etc/nginx/afeysync_proxy.conf; }
}
