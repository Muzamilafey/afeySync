# /etc/nginx/sites-available/afeysync
# Wildcard certificate for *.afeysync.com (e.g. Cloudflare origin cert or certbot DNS challenge).
# Custom facility domains get their own server_name/cert blocks (or use Cloudflare for SaaS).

upstream afeysync_api { server 127.0.0.1:4000; keepalive 32; }
upstream afeysync_web { server 127.0.0.1:3000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=afs_login:10m rate=10r/m;

server {
  listen 80;
  server_name afeysync.com *.afeysync.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name afeysync.com *.afeysync.com;

  ssl_certificate     /etc/ssl/afeysync/fullchain.pem;
  ssl_certificate_key /etc/ssl/afeysync/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  client_max_body_size 20m;

  # Behind Cloudflare, restore the real client IP (keep the list of CF ranges up to date).
  # real_ip_header CF-Connecting-IP;
  # set_real_ip_from 173.245.48.0/20; ...

  location /api/v1/auth/login       { limit_req zone=afs_login burst=5 nodelay; proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /api/v1/owner/auth/login { limit_req zone=afs_login burst=5 nodelay; proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /api/  { proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /health { proxy_pass http://afeysync_api; include /etc/nginx/afeysync_proxy.conf; }
  location /      { proxy_pass http://afeysync_web; include /etc/nginx/afeysync_proxy.conf; }
}

